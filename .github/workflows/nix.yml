name: Nix BSP

on:
  pull_request:
    paths:
      - '**.nix'
      - flake.lock
      - nix/**
      - deps/**
      - .gitmodules
      - kernel-source
      - libcamera/**
      - configs/**
      - dts/**
      - initramfs-src/**
      - keymint/**
      - sensors/**
      - scripts/**
      - mk*img
      - avb-test-key.pem
      - .github/workflows/nix.yml
  push:
    branches: [main, nix-full]
  workflow_dispatch:
    inputs:
      publish_cache:
        description: Stage and publish signed cache outputs
        type: boolean
        default: false
      cache_from_run:
        description: Reuse cache artifact from this workflow run ID
        type: string
        default: ''
      build_nixos:
        description: Also build the minimal NixOS toplevel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ !inputs.cache_from_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - name: Validate locks, formatting and flake
        run: |
          python3 scripts/deps.py check --locked
          python3 scripts/gen-nix-sources.py --check
          nix fmt -- --check flake.nix nix/*.nix
          nix flake show --all-systems
          nix flake check --all-systems --no-build
          nix eval --raw .#nixosConfigurations.zhiyu.config.system.build.toplevel.drvPath
          python3 scripts/test-nix-incremental.py
      - name: Verify the nix-stable export
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          stable="$RUNNER_TEMP/nix-stable"
          python3 scripts/make-nix-stable.py "$stable" --repository "$REPOSITORY"
          package_drvs() {
            nix eval --json "$1#packages.aarch64-linux" \
              --apply 'builtins.mapAttrs (_: package: package.drvPath)'
          }
          package_drvs . > "$RUNNER_TEMP/main-drvs.json"
          package_drvs "path:$stable" > "$RUNNER_TEMP/stable-drvs.json"
          cmp "$RUNNER_TEMP/main-drvs.json" "$RUNNER_TEMP/stable-drvs.json"
          system_attr=nixosConfigurations.zhiyu.config.system.build.toplevel.drvPath
          test "$(nix eval --raw ".#$system_attr")" = "$(nix eval --raw "path:$stable#$system_attr")"
          nix flake check "path:$stable" --all-systems --no-build
      - name: Traditional build tools
        run: |
          python3 scripts/test-build-tools.py
          python3 scripts/test-ci-tools.py

  arm64:
    name: Native ARM64
    needs: evaluate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
      - name: Configure the signed cache
        if: ${{ vars.NIX_CACHE_PUBLIC_KEY != '' }}
        env:
          NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          {
            printf 'extra-substituters = https://raw.githubusercontent.com/%s/nix-repodata\n' "$GITHUB_REPOSITORY"
            printf 'extra-trusted-public-keys = %s\n' "$NIX_CACHE_PUBLIC_KEY"
          } >> "$GITHUB_ENV.nix"
          echo "NIX_USER_CONF_FILES=$GITHUB_ENV.nix" >> "$GITHUB_ENV"
      - name: Build and verify the BSP
        run: |
          nix flake check -L --keep-going
      - name: Build minimal NixOS generation
        if: inputs.build_nixos
        run: |
          system=$(nix build --no-link --print-out-paths -L .#nixosConfigurations.zhiyu.config.system.build.toplevel)
          cmp "$system/etc/zhiyu/boot-id" "$system/etc/zhiyu/boot-images/BOOT-IDS"
          grep -Fx 'KERNEL=="v4l-subdev*", GOTO="persistent_v4l_end"' "$system/etc/udev/rules.d/60-persistent-v4l.rules"
      - name: Stage the runtime cache closure
        if: inputs.publish_cache && github.ref_name == github.event.repository.default_branch
        run: |
          set -o pipefail
          nix build --no-link --print-out-paths -L \
            '.#kernel^*' .#dtb .#firmware .#sns .#topology .#ucm2 .#udev-rules \
            .#initramfs .#busybox .#fsck-f2fs .#keymint .#static-helpers \
            .#sensh .#sensord .#hexagonrpc '.#libcamera-0_7^*' '.#libcamera-0_8^*' \
            .#flasher .#qcom-va-driver |
            python3 scripts/nix-cache.py prepare "$RUNNER_TEMP/nix-cache"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.publish_cache && github.ref_name == github.event.repository.default_branch
        with:
          name: nix-cache
          path: ${{ runner.temp }}/nix-cache/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stable:
    name: Update nix-stable
    needs: arm64
    if: >-
      ${{ github.event_name != 'pull_request' && !inputs.cache_from_run &&
          github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    concurrency:
      group: nix-stable
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish generated source and revision table
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/nix-stable-source"
          python3 scripts/make-nix-stable.py "$snapshot" --repository "$REPOSITORY"
          export GIT_INDEX_FILE="$RUNNER_TEMP/nix-stable.index"
          git read-tree --empty
          git --work-tree="$snapshot" -c core.autocrlf=false add --force --all
          tree=$(git write-tree)
          default_tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [[ "$default_tip" != "$GITHUB_SHA" ]]; then
            echo 'A newer default-branch commit superseded this run.'
            exit 0
          fi
          current=$(git ls-remote origin refs/heads/nix-stable | cut -f1)
          parents=()
          if [[ -n "$current" ]]; then
            git fetch --depth=1 origin "$current"
            if [[ "$(git rev-parse "$current^{tree}")" == "$tree" ]]; then
              echo 'nix-stable already has this snapshot.'
              exit 0
            fi
            parents=(-p "$current")
          fi
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(git commit-tree "$tree" "${parents[@]}" \
            -m "nix-stable: ${GITHUB_SHA:0:12}" -m "Source-Commit: $GITHUB_SHA")
          git push origin "$commit:refs/heads/nix-stable"

  publish:
    needs: arm64
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.publish_cache && (needs.arm64.result == 'success' || inputs.cache_from_run != '') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: nix-cache-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check that publication is configured
        id: signing
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          if [[ -n "$NIX_CACHE_SIGNING_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Cache publication skipped. NIX_CACHE_SIGNING_KEY is unset.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
        if: steps.signing.outputs.enabled == 'true'
      - name: Validate the artifact run
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.cache_from_run || github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ $ARTIFACT_RUN =~ ^[0-9]+$ ]]
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN"
          gh api "$endpoint" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
            .head_repository.full_name == $repo and .head_branch == $branch
            and .path == ".github/workflows/nix.yml" and .event == "workflow_dispatch"
          '
          gh api --paginate --slurp "$endpoint/jobs?per_page=100" |
            jq -e 'any(.[].jobs[]; .name == "Native ARM64" and .conclusion == "success")'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: nix-cache
          path: ${{ runner.temp }}/nix-cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cache_from_run || github.run_id }}
      - name: Sign and publish NARs and index
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          gh auth setup-git
          python3 scripts/nix-cache.py publish "$RUNNER_TEMP/nix-cache" \
            --repository "$GITHUB_REPOSITORY" --tag "nix-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
