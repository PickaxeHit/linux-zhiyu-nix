name: Build and publish Void BSP (experimental)

on:
  push:
    branches: [nix-full]
    paths:
      - '.github/workflows/void-builder.yml'
      - 'containers/images.json'
      - 'scripts/run-package-container.sh'
      - 'scripts/container-deps.sh'
      - 'scripts/mkxbps.sh'
      - 'scripts/package-void-extras.sh'
      - 'scripts/void/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed experimental XBPS repository in this repository's Releases
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: void-bsp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CONTAINER_ENGINE: docker
      CONTAINER_PULL: always
      KERNEL_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse packages if only the validation workflow changed
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only reuse artifacts from this repository's completed Void runs
          # on the same branch, and only when all build inputs are unchanged.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/void-builder.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=15" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == .repository.full_name and (.event == "push" or .event == "workflow_dispatch")) | [.id,.head_sha] | @tsv')
          while read -r run source; do
            [[ "$run" =~ ^[0-9]+$ && "$source" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "$source^{commit}" 2>/dev/null || continue
            git diff --quiet "$source" "$GITHUB_SHA" -- . ':(exclude).github/workflows/void-builder.yml' || continue
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=zhiyu-void-aarch64-untested" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            [[ "$count" == 1 ]] || continue
            mkdir -p out/xbps
            gh run download "$run" --name zhiyu-void-aarch64-untested --dir out/xbps
            python3 - "$source" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path("out/xbps")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["source"]["main"] == sys.argv[1], "Source SHA mismatch"
          expected = {Path(k).name: v for k, v in manifest["artifacts"].items() if k.startswith("xbps/") and k.endswith(".xbps")}
          actual = {p.name: p for p in root.glob("*.xbps")}
          assert len(actual) == 10 and actual.keys() == expected.keys(), "Package set mismatch"
          for name, p in actual.items():
              with p.open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == expected[name]["sha256"], name
              assert p.stat().st_size == expected[name]["size"], name
          PY
            echo "Reusing verified BSP artifacts from run $run ($source)"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$runs"
          echo 'reused=false' >> "$GITHUB_OUTPUT"
      - name: Set package revision
        if: steps.reuse.outputs.reused != 'true'
        run: echo "PKG_REVISION=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Smoke test Void container entrypoint
        if: steps.reuse.outputs.reused != 'true'
        run: |
          image=$(python3 -c 'import json; print(json.load(open("containers/images.json"))["void"])')
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh "$image" -ec '
            test "$(xbps-uhelper arch)" = aarch64
            xbps-install -Suy xbps
            xbps-install -Suy
            xbps-install -y bash
            exec /bin/bash -c "bash --version; command -v xbps-create; command -v xbps-rindex"
          '
      - name: Prepare pinned inputs and native tools
        if: steps.reuse.outputs.reused != 'true'
        run: |
          scripts/init-submodules.sh
          python3 scripts/deps.py check --locked
          scripts/install-ubuntu-build-deps.sh
          scripts/setup-rust.sh
      - name: Identify kernel toolchain
        if: steps.reuse.outputs.reused != 'true'
        id: toolchain
        run: echo "id=$(gcc --version | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore shared kernel compiler cache
        id: ccache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
            void-ccache-${{ runner.arch }}-
      - name: Validate scripts
        if: steps.reuse.outputs.reused != 'true'
        run: |
          for script in build.sh scripts/*.sh scripts/void/*.run scripts/void/*.INSTALL; do bash -n "$script"; done
          python3 scripts/test-build-tools.py
          python3 scripts/test-ci-tools.py
          python3 scripts/void/test-elf-deps.py
      - name: Build shared kernel and images
        if: steps.reuse.outputs.reused != 'true'
        run: |
          ccache -z
          ./build.sh images
          ccache -s
      - name: Save shared kernel compiler cache before packaging
        if: steps.reuse.outputs.reused != 'true' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Build Void packages
        if: steps.reuse.outputs.reused != 'true'
        run: |
          ./build.sh packages --distro void
          ./build.sh manifest
      - name: Preserve built packages before installation tests
        if: steps.reuse.outputs.reused != 'true'
        run: cp out/manifest.json out/xbps/manifest.json
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: zhiyu-void-aarch64-untested
          path: out/xbps/
          if-no-files-found: error
          compression-level: 0
      - name: Index packages and test installation in an independent Void container
        run: |
          # Use the exact recorded registry digest, including on a reused build.
          image=$(python3 -c 'import json; m=json.load(open("out/xbps/manifest.json")); e=m["package_environments"]["void/userspace"]; print(next(d for d in e["repo_digests"] if "@sha256:" in d))')
          docker pull --platform linux/arm64 "$image"
          docker run --rm --platform linux/arm64 --user 0:0 \
            -v "$PWD/out/xbps:/repo" --entrypoint /bin/sh "$image" -ec '
              xbps-rindex -a /repo/*.xbps
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -y libcamera
              xbps-install -y --repository=/repo linux-zhiyu-modules linux-zhiyu-headers linux-zhiyu-firmware linux-zhiyu-images libcamera-zhiyu zhiyu-sensord qcom-va-driver
              # OCI images may supply /proc/mounts rather than the symlink
              # recorded by Void base-files. Normalize only that known case.
              if [ "$(readlink /etc/mtab)" = /proc/mounts ]; then
                ln -sfn /proc/self/mounts /etc/mtab
              fi
              echo "Checking installed package database"
              xbps-pkgdb -a
              echo "Checking runit services and runtime linkage"
              set -x
              for service in hexagonrpcd-adsp-rootpd hexagonrpcd-adsp-sensorspd zhiyu-sensord; do test -x "/etc/sv/$service/run"; done
              test -x /usr/bin/sensh
              for driver in v4l2 msm qcom; do test -f "/usr/lib/dri/${driver}_drv_video.so"; done
              loader=/usr/lib/ld-linux-aarch64.so.1
              test -x "$loader"
              for binary in /usr/bin/zhiyu-sensord /usr/bin/sensh /usr/bin/hexagonrpcd /usr/lib/dri/v4l2_drv_video.so /usr/lib/libcamera.so.*; do
                test -f "$binary"
                deps=$("$loader" --list "$binary")
                echo "$deps"
                if printf "%s\n" "$deps" | grep -q "not found"; then exit 1; fi
              done
            '
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyu-void-aarch64
          path: out/xbps/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: (github.event_name == 'push' || inputs.publish) && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zhiyu-void-aarch64
          path: repo
      - name: Sign repository
        env:
          VOID_REPO_SIGNING_KEY: ${{ secrets.VOID_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/void-key.pem"
          trap 'rm -f "$key"' EXIT
          : "${VOID_REPO_SIGNING_KEY:?Configure VOID_REPO_SIGNING_KEY in repository secrets}"
          printf '%s\n' "$VOID_REPO_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out repo/repo-public.pem
          docker run --rm --platform linux/arm64 --user 0:0 \
            -v "$PWD/repo:/repo" -v "$key:/key.pem:ro" \
            --entrypoint /bin/sh ghcr.io/void-linux/void-glibc-full:latest -ec '
              xbps-rindex -a /repo/*.xbps
              xbps-rindex --privkey /key.pem --sign --signedby "Zhiyu Void BSP test" /repo
              xbps-rindex --privkey /key.pem --sign-pkg /repo/*.xbps
            '
          sudo chown -R "$(id -u):$(id -g)" repo
          (cd repo && sha256sum -- *.xbps *.sig2 aarch64-repodata manifest.json repo-public.pem > SHA256SUMS)
      - name: Preserve signed repository
        uses: actions/upload-artifact@v4
        with:
          name: zhiyu-void-aarch64-signed
          path: repo/
          if-no-files-found: error
          compression-level: 0
      - name: Publish fixed XBPS repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=repo-xbps
          source_sha=$(python3 -c 'import json; print(json.load(open("repo/manifest.json"))["source"]["main"])')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          notes="Experimental signed XBPS repository. Build source: $source_sha. Validation: $GITHUB_SHA. The fixed tag is a publication channel, not the build source; see manifest.json. Verify the key before trusting it. Services and boot image updates are opt-in."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern repo-public.pem --dir "$RUNNER_TEMP"
            cmp -s "$RUNNER_TEMP/repo-public.pem" repo/repo-public.pem || { echo '::error::Repository signing key mismatch'; exit 1; }
            # Never overwrite a package filename with different bytes. Keep
            # older packages and signatures for clients using a cached index.
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/void-release.json"
            python3 - "$RUNNER_TEMP/void-release.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          release = json.load(open(sys.argv[1]))
          assets = {a["name"]: a for a in release["assets"]}
          for p in Path("repo").glob("*.xbps"):
              if p.name in assets:
                  with p.open("rb") as stream:
                      digest = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
                  assert assets[p.name].get("digest") == digest, f"Refusing to replace different package bytes: {p.name}"
          PY
            for package in repo/*.xbps; do
              name=$(basename "$package")
              if ! jq -e --arg name "$name" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/void-release.json" > /dev/null; then
                gh release upload "$tag" "$package" --repo "$GITHUB_REPOSITORY"
              fi
              sig="$package.sig2"
              sig_name=$(basename "$sig")
              if ! jq -e --arg name "$sig_name" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/void-release.json" > /dev/null; then
                gh release upload "$tag" "$sig" --repo "$GITHUB_REPOSITORY"
              else
                actual="sha256:$(sha256sum "$sig" | cut -d' ' -f1)"
                expected=$(jq -r --arg name "$sig_name" '.assets[] | select(.name == $name) | .digest' "$RUNNER_TEMP/void-release.json")
                [[ "$actual" == "$expected" ]] || { echo "Signature mismatch for $name"; exit 1; }
              fi
            done
            gh release upload "$tag" repo/manifest.json repo/repo-public.pem repo/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            # Publish the signed index only after all referenced files exist.
            gh release upload "$tag" repo/aarch64-repodata --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --title "Void aarch64 BSP repository (experimental)" \
              --notes "$notes" repo/*
          fi
          echo "Repository: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" >> "$GITHUB_STEP_SUMMARY"
